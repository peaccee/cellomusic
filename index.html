<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>續曲室內樂團 課務</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#F0F0F0;
  --ink-soft:#e6e6ed;
  --paper:#819cb3;
  --paper-dim:#dbe0ea;
  --dawn:#f2efeb;
  --dawn-dim:#18548f;
  --dusk:#f2efeb;
  --dusk-dim:#66380a;
  --rest:#f2efeb;
  --rest-dim:#4f6109;
  --flag:#f5b745;
  --muted:#5c677d;
  --line:rgba(241,243,248,0.12);
  --radius:14px;
  font-size:16px;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  max-width:100%;
}

body{
  background:var(--ink);
  color:var(--paper);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'PingFang TC','Microsoft JhengHei',sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  padding-bottom:64px;
  overflow-x:hidden;
}

.wrap{
  width:100%;
  max-width:640px;
  margin:0 auto;
  padding:20px 16px 40px;
}

/* ---------- Header ---------- */

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px;
  gap:12px;
}

.brand{
  display:flex;
  flex-direction:column;
  min-width:0;
}

.brand .eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  letter-spacing:.18em;
  color:var(--muted);
  text-transform:uppercase;
}

.brand h1{
  font-family:'Fraunces',serif;
  font-weight:600;
  font-size:26px;
  margin:2px 0 0;
  letter-spacing:-0.01em;
}

.sync-info{
  margin-top:5px;
  font-size:10px;
  color:var(--muted);
}

.btn{
  font-family:'Inter',sans-serif;
  font-weight:600;
  font-size:13.5px;
  border:1px solid var(--line);
  background:transparent;
  color:var(--paper);
  padding:9px 14px;
  border-radius:999px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  transition:background .15s ease,transform .1s ease;
}

.btn:hover{
  background:rgba(241,243,248,0.08);
}

.btn:active{
  transform:scale(0.97);
}

.btn-primary{
  background:var(--paper);
  color:var(--ink);
  border-color:var(--paper);
}

.btn-primary:hover{
  background:#fff;
}

.btn-ghost{
  border:none;
  color:var(--muted);
  padding:6px 8px;
}

.btn-danger{
  color:#e57373;
  border-color:rgba(229,115,115,0.4);
}

section{
  margin-bottom:30px;
}

.section-label{
  font-family:'IBM Plex Mono',monospace;
  font-size:11.5px;
  letter-spacing:.14em;
  color:var(--muted);
  text-transform:uppercase;
  margin:0 0 10px 2px;
}

/* ---------- Punch card ---------- */

.punch-card{
  position:relative;
  width:100%;
  background:var(--paper);
  color:var(--ink);
  border-radius:var(--radius);
  padding:26px 22px 22px;
  display:flex;
  align-items:stretch;
  gap:18px;
  box-shadow:0 18px 40px -18px rgba(0,0,0,0.5);
}



.punch-left{
  flex:1 1 auto;
  min-width:0;
}

.punch-left .weekday{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  letter-spacing:.1em;
  color:var(--muted);
  text-transform:uppercase;
}

.punch-left .datenum{
  font-family:'Fraunces',serif;
  font-weight:700;
  font-size:44px;
  line-height:1.05;
  margin:2px 0 10px;
}

.punch-tag{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:12.5px;
  font-weight:600;
  padding:5px 10px;
  border-radius:999px;
  background:rgba(27,32,40,0.08);
}

.punch-divider{
  width:1px;
  border-left:2px dashed rgba(27,32,40,0.2);
}

.punch-right{
  flex:1 1 auto;
  display:flex;
  flex-direction:column;
  justify-content:center;
  min-width:0;
}

.punch-right .code{
  font-family:'IBM Plex Mono',monospace;
  font-weight:600;
  font-size:15px;
  color:var(--muted);
}

.punch-right .time{
  font-family:'IBM Plex Mono',monospace;
  font-weight:600;
  font-size:22px;
  margin-top:4px;
  letter-spacing:-0.02em;
}

.punch-right .note{
  margin-top:8px;
  font-size:12.5px;
  color:var(--flag);
  font-weight:600;
}

.punch-right .empty{
  font-size:14px;
  color:var(--muted);
}

.type-early .punch-tag{
  background:var(--dawn-dim);
  color:var(--dawn);
}

.type-late .punch-tag{
  background:var(--dusk-dim);
  color:var(--dusk);
}

.type-leave .punch-tag{
  background:var(--rest-dim);
  color:var(--rest);

}

/* ---------- 7-day strip ---------- */

.week-scroll{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:2px 2px 6px;
  scrollbar-width:none;
  width:100%;
}

.week-scroll::-webkit-scrollbar{
  display:none;
}

.day-chip{
  flex:0 0 auto;
  width:86px;
  background:var(--ink-soft);
  border-radius:12px;
  padding:12px 10px;
  border:1px solid var(--line);
}

.day-chip.today{
  border-color:var(--paper);
}

.day-chip .dc-weekday{
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  color:var(--muted);
  letter-spacing:.08em;
}

.day-chip .dc-date{
  font-family:'Fraunces',serif;
  font-size:20px;
  font-weight:600;
  margin:2px 0 8px;
}

.day-chip .dc-badge{
  display:inline-block;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  font-weight:600;
  padding:3px 7px;
  border-radius:6px;
  margin-bottom:5px;
}

.day-chip .dc-time{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  color:var(--muted);
}

.day-chip .dc-empty{
  font-size:11.5px;
  color:var(--muted);
  padding-top:6px;
}

.badge-early{
  background:var(--dawn-dim);
  color:var(--dawn);
}

.badge-late{
  background:var(--dusk-dim);
  color:var(--dusk);
}

.badge-leave{
  background:var(--rest-dim);
  color:var(--rest);
}

/* ---------- Month calendar ---------- */

.month-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
  width:100%;
}

.month-head .mh-title{
  font-family:'Fraunces',serif;
  font-size:19px;
  font-weight:600;
}

.month-nav{
  display:flex;
  align-items:center;
  gap:4px;
}

.weekday-row{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:6px;
  width:100%;
  margin-bottom:6px;
}

.weekday-row span{
  min-width:0;
  text-align:center;
  font-size:11px;
  color:var(--muted);
  font-family:'IBM Plex Mono',monospace;
}

.month-grid{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:6px;
  width:100%;
  min-width:0;
}

.day-cell{
  height:100px;
  width:100%;
  min-width:0;
  max-width:100%;
  aspect-ratio:auto;
  border-radius:10px;
  background:var(--ink-soft);
  border:1px solid var(--line);
  padding:6px 5px;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  gap:3px;
  position:relative;
  overflow:hidden;
  transition:background .12s ease,transform .08s ease;
}

.day-cell:hover{
  background:#c9ceda;
}

.day-cell:active{
  transform:scale(0.96);
}

.day-cell.empty-cell{
  background:transparent;
  border-color:transparent;
  cursor:default;
}

.day-cell.is-today{
  box-shadow:inset 0 0 0 1.5px var(--paper);
}

.day-cell .num{
  min-width:0;
  font-family:'IBM Plex Mono',monospace;
  font-size:11.5px;
  color:var(--muted);
  line-height:1.2;
}

.day-cell.is-today .num{
  color:var(--paper);
  font-weight:700;
}

.day-cell .chip{
  display:block;
  max-width:100%;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:9px;
  font-weight:700;
  font-family:'IBM Plex Mono',monospace;
  padding:2px 4px;
  border-radius:5px;
  align-self:flex-start;
  line-height:1.5;
}

.day-cell .mini-time{
  display:block;
  max-width:100%;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:13px;
  color:var(--muted);
  font-family:'IBM Plex Mono',monospace;
  line-height:1.2;
}

.day-cell .flag-dot{
  position:absolute;
  top:6px;
  right:6px;
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--flag);
}

/* ---------- Stats ---------- */

.stats-card{
  width:100%;
  background:var(--ink-soft);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:18px;
}

.stats-top{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  margin-bottom:12px;
}

.stats-top .big{
  font-family:'Fraunces',serif;
  font-size:26px;
  font-weight:600;
}

.stats-top .big span{
  font-size:15px;
  color:var(--muted);
  font-weight:400;
  font-family:'Inter',sans-serif;
}

.quota-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:10px;
}

.quota-pill{
  flex:1 1 auto;
  min-width:84px;
  background:var(--ink);
  border-radius:10px;
  padding:9px 10px;
  border:1px solid var(--line);
}

.quota-pill .ql-label{
  font-size:11px;
  color:var(--muted);
}

.quota-pill .ql-val{
  font-family:'IBM Plex Mono',monospace;
  font-size:16px;
  font-weight:600;
  margin-top:2px;
  color:#34354f
}

.quota-pill .ql-val{
  font-family:'IBM Plex Mono',monospace;
  font-size:16px;
  font-weight:600;
  margin-top:2px;
  color:#34354f;
}

.quota-pill.over .ql-val{
  color:#d06a68;
}

.extra-row{
  display:flex;
  gap:16px;
  flex-wrap:wrap;
  font-size:12.5px;
  color:var(--muted);
  margin-top:4px;
}

.extra-row b{
  color:var(--paper);
}

.no-quota{
  font-size:13px;
  color:var(--muted);
}

/* ---------- Empty ---------- */

.empty-state{
  border:1px dashed var(--line);
  border-radius:var(--radius);
  padding:26px 18px;
  text-align:center;
  color:var(--muted);
  font-size:14px;
}

.empty-state .btn{
  margin-top:12px;
}

/* ---------- Modal ---------- */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(15,18,23,0.72);
  backdrop-filter:blur(3px);
  display:flex;
  align-items:flex-end;
  justify-content:center;
  z-index:50;
  opacity:0;
  pointer-events:none;
  transition:opacity .18s ease;
}

.overlay.show{
  opacity:1;
  pointer-events:auto;
}

.modal{
  background:var(--ink-soft);
  width:100%;
  max-width:640px;
  border-radius:18px 18px 0 0;
  padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  max-height:86vh;
  overflow-y:auto;
  transform:translateY(16px);
  transition:transform .18s ease;
  border-top:1px solid var(--line);
}

.overlay.show .modal{
  transform:translateY(0);
}

.modal h2{
  font-family:'Fraunces',serif;
  font-size:20px;
  margin:0 0 4px;
}

.modal .sub{
  font-size:12.5px;
  color:var(--muted);
  margin-bottom:16px;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  font-size:12.5px;
  color:var(--muted);
  margin-bottom:6px;
}

input[type=month],
select,
textarea{
  width:100%;
  max-width:100%;
  background:var(--ink);
  border:1px solid var(--line);
  color:var(--paper);
  border-radius:10px;
  padding:10px 12px;
  font-family:'IBM Plex Mono',monospace;
  font-size:13.5px;
}

textarea{
  min-height:150px;
  resize:vertical;
  line-height:1.6;
}

select{
  font-family:'Inter',sans-serif;
}

.hint-box{
  background:var(--ink);
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px 12px;
  font-size:12px;
  color:var(--muted);
  line-height:1.7;
  margin-bottom:14px;
}

.hint-box code{
  color:var(--paper);
  background:rgba(241,243,248,0.08);
  padding:1px 5px;
  border-radius:4px;
}

.checkbox-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:14px;
  font-size:13px;
  color:var(--paper);
}

.checkbox-row input{
  width:16px;
  height:16px;
}

.preview-box{
  background:var(--ink);
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px 12px;
  max-height:140px;
  overflow-y:auto;
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  margin-bottom:14px;
}

.preview-box .pv-line{
  padding:2px 0;
  color:var(--paper);
}

.preview-box .pv-err{
  color:var(--flag);
}

.modal-actions{
  display:flex;
  gap:10px;
  margin-top:6px;
}

.modal-actions .btn{
  flex:1;
  justify-content:center;
}

.modal-close{
  position:absolute;
  top:14px;
  right:14px;
}

.modal-wrap{
  position:relative;
}

.toast{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  background:var(--paper);
  color:var(--ink);
  padding:10px 18px;
  border-radius:999px;
  font-size:13.5px;
  font-weight:600;
  box-shadow:0 10px 30px -10px rgba(0,0,0,0.5);
  z-index:80;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s ease,transform .2s ease;
  max-width:90%;
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(-6px);
}

/* ---------- Mobile ---------- */

@media(max-width:600px){

  /* Q002、Q013 等班別代號 */
  .day-cell .chip{
    font-size:8px !important;
    padding:2px 3px;
    line-height:1.4;
  }

  /* 08:00、13:00 等上班時間 */
  .day-cell .mini-time{
    font-size:11px !important;
    line-height:1.3;
    white-space:nowrap;
  }

}

@media(max-width:600px){

  .wrap{
    padding-left:14px;
    padding-right:14px;
  }

  .punch-card{
    padding-left:18px;
    padding-right:18px;
    gap:14px;
  }

  .punch-left .datenum{
    font-size:36px;
  }

  .punch-right .time{
    font-size:19px;
  }

  .weekday-row,
  .month-grid{
    gap:4px;
  }

  .day-cell{
    height:70px;
    padding:5px 3px;
    border-radius:8px;
  }

  .day-cell .num{
    font-size:10.5px;
  }

  .day-cell .chip{
    font-size:8px;
    padding:2px 2px;
  }

  .day-cell .mini-time{
    font-size:7.5px;
  }

}

/* =========================================================
   續曲班表：新增元件樣式（沿用上方原設計變數）
   ========================================================= */
input[type=time],
input[type=number],
input[type=text]{
  width:100%;
  max-width:100%;
  background:var(--ink);
  border:1px solid var(--line);
  color:var(--paper);
  border-radius:10px;
  padding:10px 12px;
  font-family:'IBM Plex Mono',monospace;
  font-size:13.5px;
}

.readonly-tag{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  padding:6px 10px;
  border-radius:999px;
  border:1px solid var(--line);
  color:var(--muted);
}

/* 今日打卡卡：多時段 */
.slot-line{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;
  margin-top:8px;
}
.slot-line:first-child{ margin-top:0; }
.slot-line .sl-time{
  font-family:'IBM Plex Mono',monospace;
  font-weight:600;
  font-size:18px;
  letter-spacing:-0.02em;
}
.st{
  font-family:'Inter',sans-serif;
  font-size:11.5px;
  font-weight:600;
  padding:2px 8px;
  border-radius:999px;
}
.st-1{ background:var(--dawn-dim); color:var(--dawn); }
.st-0{ background:var(--flag); color:#3a2a05; }
.st-2{ background:rgba(255,255,255,0.22); color:var(--ink); }

/* 近 7 日 */
.day-chip{ cursor:pointer; }
.day-chip .dc-badge{
  display:block;
  width:fit-content;
  font-size:10.5px;
}
.sb-1{ background:var(--dawn-dim); color:var(--dawn); }
.sb-0{ background:rgba(245,183,69,0.28); color:#8a5d06; }
.sb-2{ background:rgba(92,103,125,0.12); color:var(--muted); text-decoration:line-through; }

/* 月曆勾選 */
.legend{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  font-size:11.5px;
  color:var(--muted);
  margin:0 0 10px 2px;
}
.legend span{ display:inline-flex; align-items:center; gap:5px; }
.legend i{
  display:inline-block;
  width:12px;
  height:12px;
  border-radius:4px;
}
.legend .lg-1{ background:var(--dawn-dim); }
.legend .lg-0{ background:rgba(245,183,69,0.3); border:1.5px solid var(--flag); }
.legend .lg-2{ background:rgba(92,103,125,0.18); }

.day-cell.no-slot{ opacity:.55; }
.slot-pill{
  display:block;
  width:100%;
  min-width:0;
  appearance:none;
  -webkit-appearance:none;
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  font-weight:700;
  line-height:1.3;
  padding:4px 3px;
  border-radius:6px;
  border:1.5px solid transparent;
  text-align:left;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  cursor:pointer;
}
span.slot-pill{ cursor:default; }
.slot-pill.xt{ border-style:dashed; }
.slot-pill.s1.xt{ box-shadow:inset 0 0 0 1px rgba(255,255,255,0.55); }
.slot-pill.s0{
  border-color:var(--flag);
  color:#8a5d06;
  background:rgba(245,183,69,0.2);
}
.slot-pill.s1{
  background:var(--dawn-dim);
  border-color:var(--dawn-dim);
  color:var(--dawn);
}
.slot-pill.s2{
  background:rgba(92,103,125,0.12);
  color:var(--muted);
  text-decoration:line-through;
}
.slot-pill:active{ transform:scale(0.95); }

/* 統計 */
.bar{
  height:8px;
  border-radius:99px;
  background:rgba(92,103,125,0.18);
  overflow:hidden;
  margin:2px 0 14px;
}
.bar i{
  display:block;
  height:100%;
  background:var(--dawn-dim);
  border-radius:99px;
  transition:width .25s ease;
}

/* 主管檢視：全部時段 */
.need-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:10px;
  font-size:13px;
  color:var(--muted);
}
.need-head b{ color:#8a5d06; }
.need-head .btn{ font-size:12.5px; padding:7px 12px; }
.t-row{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  padding:10px 12px;
  border-radius:10px;
  background:var(--ink-soft);
  border:1px solid var(--line);
  margin-bottom:6px;
}

section{ margin-bottom:16px; }

.t-slots{ gap:8px; }

/* 管理視窗 */

.buy-head, .buy-row{ display:grid; grid-template-columns:1.4fr 1fr 1fr 30px; gap:6px; align-items:center; }

<div class="wrap">

  <div class="topbar">

      <div class="sync-info" id="syncInfo">讀取資料中…</div>
    </div>
    <button class="btn btn-primary" id="openManageBtn">⚙ 管理</button>
    <span class="readonly-tag" id="readonlyTag" style="display:none;">唯讀檢視</span>
  </div>

  <div class="tabs" id="tabs">
    <button type="button" class="on" data-view="cal">課務月曆</button>
    <button type="button" data-view="stu">學員管理</button>

  <div id="viewCal">

    <div class="section-label" id="statsLabel">值班時數統計</div>
    <div class="stats-card" id="statsCard"></div>
  </section>

  <section class="sec-month">
    <div class="month-head">
      <div class="mh-title" id="monthTitle"></div>
      <div class="month-nav">
        <button class="btn btn-ghost" id="prevMonthBtn">‹</button>
        <button class="btn btn-ghost" id="todayMonthBtn" style="font-size:12px;">本月</button>
        <button class="btn btn-ghost" id="nextMonthBtn">›</button>
      </div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="weekday-row">
      <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
    </div>
    <div class="month-grid" id="monthGrid"></div>
  </section>

  <section>
    <div class="section-label" id="needLabel">本月課表</div>
    <div class="need-head" id="needHead"></div>
    <div id="needList"></div>
  </section>
  </div>

</div>

<div class="toast" id="toast"></div>

<!-- 班級時段管理 -->
<div class="overlay" id="manageOverlay">
  <div class="modal">
    <div class="modal-wrap">
      <button class="btn btn-ghost modal-close" id="closeManageBtn">✕</button>
      <h2>班級時段管理</h2>
      <div class="sub">固定時段會套用到每週；也可管理值班人員</div>

      <div class="m-block">
        <div class="field">
          <label>快速新增（每週：週三 18:30-20:00 班級名稱；自選日期：11/7 11/21 10:00-12:00 班級名稱）</label>
          <div style="display:flex;gap:8px;">
            <input type="text" id="quickInput" placeholder="週六 10:00-12:00 班級名稱">

          </div>
        </div>

          <label>目前班級時段（可直接修改）</label>
          <div id="slotList"></div>

      </div>

      <div class="m-block">
        <div class="m-title">值班人員管理</div>

        <div id="buyList"></div>
        <button type="button" class="btn" id="buyAddBtn" style="margin-top:8px;">＋ 新增一期</button>
      </div>

      <div class="stu-info" id="stuInfo"></div>

      <div class="modal-actions">
        <button class="btn btn-danger" id="stuDelBtn">刪除學員</button>
        <button class="btn btn-primary" id="stuDoneBtn">完成</button>
      </div>
    </div>
  </div>
</div>

<script>
/* =========================================================
   雲端同步設定（自己架站，例如 GitHub Pages 時使用）
   到 jsonbin.io 建立一個 Bin，把 BIN_ID 與 API_KEY 填在下面，
   手機和電腦就會共用同一份資料。留空＝只存在此瀏覽器。
   （在 claude.ai 的連結裡執行時，會自動使用內建資料庫，不需要填）
   ========================================================= */
const CONFIG = {
  BIN_ID:'',
  API_KEY:''
};
const jsonbinOn = () => !!(CONFIG.BIN_ID && CONFIG.API_KEY);
function jsonbinDoc(){
  const url = `https://api.jsonbin.io/v3/b/${CONFIG.BIN_ID}`;
  return {
    get: async ()=>{
      const res = await fetch(url + '/latest', {headers:{'X-Master-Key': CONFIG.API_KEY}, cache:'no-store'});
      if(!res.ok) throw {code:'http_' + res.status};
      const j = await res.json();
      const rec = j.record;
      return {exists: !!(rec && Array.isArray(rec.slots)), data: ()=> rec};
    },
    set: async (x)=>{
      const res = await fetch(url, {method:'PUT',
        headers:{'Content-Type':'application/json','X-Master-Key': CONFIG.API_KEY}, body: JSON.stringify(x)});
      if(!res.ok) throw {code:'http_' + res.status};
    },
    onSnapshot: ()=> ()=>{}
  };
}

const CACHE_KEY = 'xuqu-schedule-cache';
const SYNC_FLAG = 'xuqu-synced';
const DOC_PATH = 'app/xuqu';
const READONLY = location.hash === '#view';

const WD   = ['週日','週一','週二','週三','週四','週五','週六'];
const WD_S = ['日','一','二','三','四','五','六'];
const PALETTE = [
  {bg:'#18548f', fg:'#f2efeb'},
  {bg:'#66380a', fg:'#f5e6d0'},
  {bg:'#4f6109', fg:'#eef3d6'},
  {bg:'#6b2f63', fg:'#f6e3f3'},
  {bg:'#0f6b66', fg:'#dff5f3'},
  {bg:'#8a2f2f', fg:'#fbe4e4'}
];

const DEFAULT_SLOTS = [
  {id:'s1', wd:3, start:'10:00', end:'12:00', name:'', from:''},
  {id:'s2', wd:3, start:'18:30', end:'20:00', name:'', from:''},
  {id:'s3', wd:4, start:'18:30', end:'21:00', name:'', from:''},
  {id:'s4', wd:6, start:'10:00', end:'12:00', name:'', from:''},
  {id:'s5', wd:6, start:'13:00', end:'15:00', name:'', from:''}
];

/*
  state.slots  : 每週固定的班級時段 {id, wd, start, end, name, from}
  state.staff  : 值班人員 {id, name, c(顏色編號)}
  state.marks  : { 日期: { 時段id: {p:人員id, n:課程說明, off:1=停課} } }
  state.extras : { 日期: [ {id, start, end, name} ] }  單次班級
  state.notes  : { 日期: 當日備註 }
*/
let state = {
  slots: DEFAULT_SLOTS.map(s=>({...s})),
  staff: [{id:'p1', name:'晏存', c:0}],
  marks:{}, notes:{}, extras:{}, students:[], att:{}, defaultTerm:8
};

const todayObj = new Date();
const pad = n => String(n).padStart(2,'0');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate = (y,m,d) => `${y}-${pad(m)}-${pad(d)}`;
const todayStr = fmtDate(todayObj.getFullYear(), todayObj.getMonth()+1, todayObj.getDate());
let viewYear = todayObj.getFullYear();
let viewMonth = todayObj.getMonth()+1;

function weekdayOf(ds){
  const [y,m,d] = ds.split('-').map(Number);
  return new Date(y, m-1, d).getDay();
}
const daysInMonth = (y,m) => new Date(y, m, 0).getDate();

/* ---------- 時間 ---------- */
function toMin(t){ const [h,m] = t.split(':').map(Number); return h*60 + (m||0); }
function slotHours(s){
  let d = toMin(s.end) - toMin(s.start);
  if(d <= 0) d += 1440;
  return d/60;
}
const fmtH = n => String(Math.round(n*100)/100);
const range = s => `${s.start}–${s.end}`;
const slotName = s => (s.name && s.name.trim()) ? s.name.trim() : '未命名';

/* ---------- 人員 ---------- */
const staffById = id => state.staff.find(s => s.id === id) || null;
const staffColor = st => PALETTE[((st && st.c) || 0) % PALETTE.length];
function staffOptions(sel){
  return `<option value="">未指派</option>` +
    state.staff.map(s=> `<option value="${s.id}" ${s.id===sel?'selected':''}>${esc(s.name)}</option>`).join('');
}

/* ---------- 時段與紀錄 ---------- */
function slotsFor(ds){
  const wd = weekdayOf(ds);
  const regular = state.slots.filter(s => s.mode === 'dates'
    ? (s.dates || []).includes(ds)
    : (s.wd === wd && (!s.from || ds >= s.from)));
  const extra = (state.extras[ds] || []).map(x => ({...x, wd, extra:true}));
  return regular.concat(extra).sort((a,b) => toMin(a.start) - toMin(b.start));
}
function getRec(ds, id){ return (state.marks[ds] && state.marks[ds][id]) || {}; }
function setRec(ds, id, patch){
  const cur = {...getRec(ds,id), ...patch};
  if(!cur.p && !cur.n && !cur.off){
    if(state.marks[ds]){
      delete state.marks[ds][id];
      if(!Object.keys(state.marks[ds]).length) delete state.marks[ds];
    }
  }else{
    (state.marks[ds] = state.marks[ds] || {})[id] = {p:cur.p||'', n:cur.n||'', off:cur.off?1:0};
  }
}

/* ---------- 學員、點名、剩餘堂數 ---------- */
const FALLBACK_TERM = 8;
const termSize = b => { const n = parseInt(b && b.n, 10); return n > 0 ? n : (state.defaultTerm || FALLBACK_TERM); };
const money = n => Math.round(n || 0).toLocaleString('en-US');

function classNames(){
  const out = [];
  const add = n => { n = (n || '').trim(); if(n && !out.includes(n)) out.push(n); };
  state.slots.forEach(s => add(s.name));
  Object.keys(state.extras).forEach(ds => (state.extras[ds] || []).forEach(x => add(x.name)));
  return out;
}
function classOptions(cur){
  const names = classNames();
  let html = `<option value="">未分班</option>` +
    names.map(n => `<option value="${esc(n)}" ${n===cur?'selected':''}>${esc(n)}</option>`).join('');
  if(cur && !names.includes(cur)) html += `<option value="${esc(cur)}" selected>${esc(cur)}（班級已不存在）</option>`;
  return html;
}
const studentById = id => state.students.find(x => x.id === id) || null;
function studentsOf(s){
  const n = (s.name || '').trim();
  return n ? state.students.filter(st => (st.classes || []).includes(n)) : [];
}
function isPresent(ds, id, stId){
  const a = state.att[ds] && state.att[ds][id];
  return !!(a && a.includes(stId));
}
function setPresent(ds, id, stId, on){
  const day = (state.att[ds] = state.att[ds] || {});
  let a = (day[id] || []).filter(x => x !== stId);
  if(on) a.push(stId);
  if(a.length) day[id] = a; else delete day[id];
  if(!Object.keys(day).length) delete state.att[ds];
}
function dropAttFor(match){      // 刪除班級時段／單次班／學員時，清掉對應點名
  Object.keys(state.att).forEach(ds=>{
    Object.keys(state.att[ds]).forEach(id=>{
      const keep = match(ds, id, state.att[ds][id]);
      if(keep !== undefined){
        if(keep.length) state.att[ds][id] = keep; else delete state.att[ds][id];
      }
    });
    if(!Object.keys(state.att[ds]).length) delete state.att[ds];
  });
}
function attendedList(stId){
  const out = [];
  Object.keys(state.att).sort().forEach(ds=>{
    const day = state.att[ds];
    const slots = slotsFor(ds);
    Object.keys(day).sort().forEach(id=>{
      if(!day[id].includes(stId)) return;
      const sl = slots.find(s => s.id === id);
      if(!sl) return;
      if(getRec(ds, id).off) return;      // 停課不計
      out.push({ds, id, cls: (sl.name || '').trim()});
    });
  });
  return out;
}
function termPos(sc, idx){          // 第 idx 堂（0 起算）落在第幾期的第幾堂
  let cum = 0;
  for(const t of sc.terms){
    if(idx < cum + t.n) return {pos: idx - cum + 1, n: t.n, over:false};
    cum += t.n;
  }
  return {pos: idx - cum + 1, n: 0, over:true};
}
function studentStats(st){
  const buys = st.buys || [];
  const names = [];
  (st.classes || []).forEach(c => { if(!names.includes(c)) names.push(c); });
  buys.forEach(b => { if(b.cls && !names.includes(b.cls)) names.push(b.cls); });
  const all = attendedList(st.id);
  const byClass = {};
  names.forEach(c=>{
    const bc = buys.filter(b => b.cls === c).slice().sort((a,b) => (a.date || '').localeCompare(b.date || ''));
    const dated = bc.filter(b => b.date).map(b => b.date).sort();
    const first = bc.length ? (dated[0] || '0000-00-00') : '';
    const att = first ? all.filter(x => x.cls === c && x.ds >= first) : [];
    let cum = 0;
    const terms = bc.map(b => { const n = termSize(b); const t = {id:b.id, n, before:cum}; cum += n; return t; });
    byClass[c] = {periods: bc.length, total: cum, used: att.length, remaining: cum - att.length, att, terms};
  });
  let tuition = 0, gear = 0;
  buys.forEach(b => { tuition += +b.tuition || 0; gear += +b.gear || 0; });
  const sum = k => Object.values(byClass).reduce((n, x) => n + x[k], 0);
  return {byClass, names, periods: sum('periods'), total: sum('total'), used: sum('used'), remaining: sum('remaining'), tuition, gear};
}
function attInfo(ds, s){
  if(READONLY) return null;
  const list = studentsOf(s);
  if(!list.length) return null;
  return {total: list.length, present: list.filter(st => isPresent(ds, s.id, st.id)).length};
}

/* ---------- Toast / 同步狀態 ---------- */
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=> t.classList.remove('show'), 2400);
}
function updateSyncInfo(text){
  const el = document.getElementById('syncInfo');
  if(el) el.textContent = text;
}

/* ---------- 讀取／儲存（claude.ai 共用資料庫＋本機快取） ---------- */
let dbRef = null;
let saveTimer = null;
let saveSeq = 0;
let pendingSave = false;
let lastPushed = '';
const ownStamps = new Set();
const DIRTY_FLAG = 'xuqu-dirty';

function migrateMarks(m){
  const first = (state.staff[0] && state.staff[0].id) || '';
  Object.keys(m).forEach(ds=>{
    const o = m[ds];
    if(!o || typeof o !== 'object'){ delete m[ds]; return; }
    Object.keys(o).forEach(id=>{
      const v = o[id];
      if(typeof v === 'number'){            // 舊版：1=已排班、2=本日無需求
        if(v === 1) o[id] = {p:first, n:'', off:0};
        else if(v === 2) o[id] = {p:'', n:'', off:1};
        else delete o[id];
      }
    });
    if(!Object.keys(o).length) delete m[ds];
  });
  return m;
}
function migrateStudent(st){
  if(!Array.isArray(st.classes)) st.classes = st.cls ? [st.cls] : [];   // 舊版：單一班級
  delete st.cls;
  st.buys = (st.buys || []).map(b => ({...b, cls: b.cls !== undefined ? b.cls : (st.classes[0] || ''), n: b.n !== undefined ? b.n : 8}));
  return st;
}
function applyData(d){
  if(!d) return;
  d = JSON.parse(JSON.stringify(d));   // 雲端回傳的資料是唯讀的，複製一份才能修改
  if(Array.isArray(d.slots)) state.slots = d.slots.map(s=> ({name:'', ...s}));
  if(Array.isArray(d.staff) && d.staff.length) state.staff = d.staff;
  if(d.notes && typeof d.notes === 'object') state.notes = d.notes;
  if(d.extras && typeof d.extras === 'object') state.extras = d.extras;
  if(d.marks && typeof d.marks === 'object') state.marks = migrateMarks(d.marks);
  if(Array.isArray(d.students)) state.students = d.students.map(migrateStudent);
  if(d.att && typeof d.att === 'object') state.att = d.att;
  if(typeof d.defaultTerm === 'number' && d.defaultTerm > 0) state.defaultTerm = d.defaultTerm;
}
function snapshotState(){ return JSON.parse(JSON.stringify(state)); }
function writeCache(){ try{ localStorage.setItem(CACHE_KEY, JSON.stringify(state)); }catch(e){} }
function readCache(){
  try{
    const raw = localStorage.getItem(CACHE_KEY);
    if(raw){ applyData(JSON.parse(raw)); return true; }
  }catch(e){}
  return false;
}
function markSynced(){ try{ localStorage.setItem(SYNC_FLAG, '1'); }catch(e){} }
function markDirty(){ try{ localStorage.setItem(DIRTY_FLAG, '1'); }catch(e){} }
function clearDirty(){ try{ localStorage.removeItem(DIRTY_FLAG); }catch(e){} }
function isDirty(){ try{ return localStorage.getItem(DIRTY_FLAG) === '1'; }catch(e){ return false; } }
function neverSynced(){ try{ return !localStorage.getItem(SYNC_FLAG); }catch(e){ return false; } }

async function loadData(){
  const hadLocal = readCache();
  const local = snapshotState();

  let db = null;
  try{
    db = (window.claude && window.claude.use) ? await window.claude.use('db') : null;
  }catch(e){ db = null; }
  if(!db && jsonbinOn()) db = {doc: jsonbinDoc};
  if(!db){
    updateSyncInfo('資料僅存於此裝置');
    return;
  }

  try{
    dbRef = db.doc(DOC_PATH);
    const snap = await dbRef.get();
    if(snap.exists && isDirty() && hadLocal && !READONLY){
      updateSyncInfo('上傳此裝置尚未同步的修改…');
      await pushDb();                 // 這個裝置有還沒上傳的修改：以本機為準
    }else if(snap.exists){
      applyData(snap.data());
      if(hadLocal && neverSynced() && !READONLY){
        Object.keys(local.marks || {}).forEach(k=>{ if(!state.marks[k]) state.marks[k] = local.marks[k]; });
        Object.keys(local.notes || {}).forEach(k=>{ if(!state.notes[k]) state.notes[k] = local.notes[k]; });
        Object.keys(local.extras || {}).forEach(k=>{ if(!state.extras[k]) state.extras[k] = local.extras[k]; });
        if(!(state.students || []).length && (local.students || []).length) state.students = local.students;
        Object.keys(local.att || {}).forEach(k=>{ if(!state.att[k]) state.att[k] = local.att[k]; });
        (local.slots || []).forEach(s=>{ if(!state.slots.some(x=> x.id === s.id)) state.slots.push(s); });
        await pushDb();
      }else{
        updateSyncInfo('已同步最新資料');
      }
    }else if(!READONLY){
      await pushDb();
    }else{
      updateSyncInfo('尚無雲端資料');
    }
    writeCache();
    markSynced();

    dbRef.onSnapshot(s=>{
      if(!s.exists || pendingSave) return;
      const d = s.data();
      if(d.updatedAt && ownStamps.has(d.updatedAt)) return;     // 自己寫入的回聲
      applyData(d);
      writeCache();
      renderAll();
      updateSyncInfo('已同步最新資料');
    }, e=>{ updateSyncInfo('雲端連線中斷：' + ((e && e.code) || '未知原因') + '，請重新整理頁面'); });
  }catch(e){
    console.error('雲端讀取失敗', e);
    dbRef = null;
    updateSyncInfo('雲端讀取失敗 · 使用此裝置資料');
  }
}

function persist(){
  if(READONLY) return;
  writeCache();
  markDirty();
  if(!dbRef){ updateSyncInfo('已儲存於此裝置'); return; }
  pendingSave = true;
  saveSeq++;
  updateSyncInfo('等待同步…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushDb, 800);
}
async function pushDb(){
  if(!dbRef) return;
  const seq = saveSeq;
  const stamp = new Date().toISOString();
  lastPushed = stamp;
  ownStamps.add(stamp);
  updateSyncInfo('正在同步…');
  try{
    await dbRef.set({ ...snapshotState(), updatedAt: stamp });
    if(seq === saveSeq) clearDirty();
    updateSyncInfo('剛剛已同步');
  }catch(e){
    console.error('雲端同步失敗', e);
    updateSyncInfo('同步失敗：' + ((e && (e.code || e.message)) || '未知原因') + '（已存此裝置，點此重試）');
  }finally{
    if(seq === saveSeq) pendingSave = false;
  }
}

async function refreshFromCloud(manual){
  if(!dbRef){ if(manual) showToast('目前沒有連上雲端，只存在此裝置'); return; }
  if(pendingSave){ if(manual) showToast('正在同步中，請稍候'); return; }
  try{
    if(isDirty() && manual){ await pushDb(); return; }       // 有尚未上傳的修改：先上傳
    const snap = await dbRef.get();
    if(!snap.exists){ if(manual) showToast('雲端還沒有資料'); return; }
    const d = snap.data();
    if(d.updatedAt && ownStamps.has(d.updatedAt)){ if(manual) showToast('已是最新資料'); return; }
    applyData(d); writeCache(); renderAll();
    updateSyncInfo('已同步最新資料');
    if(manual) showToast('已從雲端更新');
  }catch(e){
    updateSyncInfo('同步失敗：' + ((e && (e.code || e.message)) || '未知原因'));
  }
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) refreshFromCloud(false); });
document.getElementById('syncInfo').addEventListener('click', ()=> refreshFromCloud(true));

/* =========================================================
   統計（每位值班人員）
   ========================================================= */
function monthData(y, m){
  const total = daysInMonth(y, m);
  const per = {};
  state.staff.forEach(s=> per[s.id] = {h:0, n:0});
  const un = {h:0, n:0};
  const rows = [];
  for(let d=1; d<=total; d++){
    const ds = fmtDate(y, m, d);
    const list = slotsFor(ds);
    if(!list.length) continue;
    const items = list.map(s=>{
      const rec = getRec(ds, s.id);
      const h = slotHours(s);
      if(!rec.off){
        if(rec.p && per[rec.p]){ per[rec.p].h += h; per[rec.p].n++; }
        else { un.h += h; un.n++; }
      }
      return {s, rec};
    });
    rows.push({ds, d, items});
  }
  return {per, un, rows};
}

function renderStats(){
  const {per, un} = monthData(viewYear, viewMonth);
  document.getElementById('statsLabel').textContent = `${viewYear}年${viewMonth}月 值班時數統計`;

  const maxH = Math.max(1, ...state.staff.map(s=> per[s.id].h), un.h);
  let totalH = 0, totalN = 0;
  const rows = state.staff.map(st=>{
    const p = per[st.id];
    totalH += p.h; totalN += p.n;
    return `<div class="srow">
      <span class="sdot" style="background:${staffColor(st).bg}"></span>
      <span class="sname">${esc(st.name)}</span>
      <span class="sbar"><i style="width:${p.h/maxH*100}%;background:${staffColor(st).bg}"></i></span>
      <span class="sn">${p.n} 堂</span>
      <span class="sh">${fmtH(p.h)} h</span>
    </div>`;
  }).join('');

  const unRow = un.n ? `<div class="srow un">
      <span class="sdot" style="background:#f5b745"></span>
      <span class="sname">未指派</span>
      <span class="sbar"><i style="width:${un.h/maxH*100}%;background:#f5b745"></i></span>
      <span class="sn">${un.n} 堂</span>
      <span class="sh">${fmtH(un.h)} h</span>
    </div>` : '';

  document.getElementById('statsCard').innerHTML =
    rows + unRow +
    `<div class="stotal">本月共 ${totalN + un.n} 堂・${fmtH(totalH + un.h)} 小時（停課不計）</div>`;
}

/* =========================================================
   月曆
   ========================================================= */
function renderLegend(){
  document.getElementById('legend').innerHTML =
    state.staff.map(st=> `<span><i class="lg-p" style="background:${staffColor(st).bg}"></i>${esc(st.name)}</span>`).join('') +
    `<span><i class="lg-0"></i>未指派</span><span><i class="lg-2"></i>停課</span><span><i class="lg-x"></i>單次班</span>`;
}

function renderMonth(){
  document.getElementById('monthTitle').textContent = `${viewYear}年 ${viewMonth}月`;
  const first = new Date(viewYear, viewMonth-1, 1).getDay();
  const total = daysInMonth(viewYear, viewMonth);
  let html = '';
  for(let i=0;i<first;i++) html += `<div class="day-cell empty-cell"></div>`;
  for(let d=1; d<=total; d++){
    const ds = fmtDate(viewYear, viewMonth, d);
    const list = slotsFor(ds);
    const blocks = list.map(s=>{
      const rec = getRec(ds, s.id);
      const st = rec.p ? staffById(rec.p) : null;
      let who;
      if(rec.off){
        who = `<span class="cp-who off">停課</span>`;
      }else if(READONLY){
        who = st
          ? `<span class="cp-who" style="background:${staffColor(st).bg};color:${staffColor(st).fg}">${esc(st.name)}</span>`
          : `<span class="cp-who">未指派</span>`;
      }else{
        const sty = st ? ` style="background:${staffColor(st).bg};color:${staffColor(st).fg}"` : '';
        who = `<select class="cp-sel" data-ds="${ds}" data-id="${s.id}"${sty}>${staffOptions(rec.p)}</select>`;
      }
      return `<div class="cp ${rec.off?'off':''} ${s.extra?'xt':''}" data-ds="${ds}" data-id="${s.id}">
        <div class="cp-t">${s.start.replace(':','')}-${s.end.replace(':','')}</div>
        <div class="cp-name">${esc(slotName(s))}</div>
        ${who}
        ${rec.n ? `<div class="cp-note">${esc(rec.n)}</div>` : ''}
        ${(()=>{ const a = attInfo(ds, s); return (a && !rec.off && (a.present || ds <= todayStr)) ? `<div class="cp-att">到課 ${a.present}/${a.total}</div>` : ''; })()}
      </div>`;
    }).join('');
    html += `
      <div class="day-cell ${ds===todayStr?'is-today':''} ${list.length?'':'no-slot'}" data-date="${ds}">
        <span class="num">${d}</span>
        ${blocks}
      </div>`;
  }
  document.getElementById('monthGrid').innerHTML = html;
}

function copyNeedText(){
  const {un, rows} = monthData(viewYear, viewMonth);
  let lines = [`續曲室內樂團 ${viewYear}年${viewMonth}月 尚未指派值班人員的課程：`];
  rows.forEach(r=>{
    r.items.forEach(({s, rec})=>{
      if(rec.off) return;
      if(rec.p && staffById(rec.p)) return;
      lines.push(`${viewMonth}/${r.d}（${WD_S[weekdayOf(r.ds)]}）${range(s)} ${slotName(s)}`);
    });
  });
  if(!un.n) lines = [`續曲室內樂團 ${viewYear}年${viewMonth}月：所有課程皆已指派`];
  else lines.push(`共 ${un.n} 堂，${fmtH(un.h)} 小時`);
  const text = lines.join('\n');

  const fallback = ()=>{
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); showToast('已複製'); }catch(e){ showToast('複製失敗'); }
    ta.remove();
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=> showToast('已複製'), fallback);
  }else fallback();
}

function attHtml(ds, s){
  const rec = getRec(ds, s.id);
  if(rec.off) return `<div class="att-head">點名</div><div class="att-empty">本日停課，不需點名</div>`;
  if(!(s.name || '').trim()) return `<div class="att-head">點名</div><div class="att-empty">請先到「管理」為這個時段命名班級</div>`;
  const list = studentsOf(s);
  if(!list.length) return `<div class="att-head">點名</div><div class="att-empty">「${esc(slotName(s))}」還沒有學員，請到學員管理新增</div>`;
  const present = list.filter(st => isPresent(ds, s.id, st.id)).length;
  const rows = list.map(st=>{
    const sc = studentStats(st).byClass[(s.name || '').trim()];
    const on = isPresent(ds, s.id, st.id);
    let right;
    if(!sc || !sc.periods){
      right = `<span class="ar warn">未購課</span>`;
    }else{
      const idx = sc.att.findIndex(x => x.ds === ds && x.id === s.id);
      let no = '';
      if(on && idx >= 0){
        const tp = termPos(sc, idx);
        no = tp.over ? `超堂第${tp.pos}堂・` : `第${tp.pos}/${tp.n}堂・`;
      }
      const cls = sc.remaining <= 0 ? 'warn' : (sc.remaining <= 2 ? 'low' : '');
      right = `<span class="ar ${cls}">${no}剩 ${sc.remaining} 堂</span>`;
    }
    return `<label class="att-row"><input type="checkbox" data-att="${st.id}" ${on?'checked':''}><span class="an">${esc(st.name)}</span>${right}</label>`;
  }).join('');
  return `<div class="att-head">點名<span class="att-count">到課 ${present} / ${list.length}</span></div>${rows}`;
}

    const ka = key(a), kb = key(b);
    for(let i=0;i<3;i++){ if(ka[i] < kb[i]) return -1; if(ka[i] > kb[i]) return 1; }
    return 0;
  });
  const wdOptions = cur => WD.map((n,i)=> `<option value="${i}" ${i===cur?'selected':''}>${n}</option>`).join('');
  document.getElementById('slotList').innerHTML = sorted.length
    ? sorted.map(s=>{
        const isDates = s.mode === 'dates';
        const dates = (s.dates || []).slice().sort();
        const tail = isDates
          ? `<div class="sr-dates">
              <div class="dchips">${dates.map(d=>{
                const [y,m,dd] = d.split('-').map(Number);
                return `<span class="dchip" title="${d}">${m}/${dd}<button type="button" data-deldate="${d}">✕</button></span>`;

            </div>`
          : `<div class="sr-from">每 <select data-f="wd">${wdOptions(s.wd)}</select> 自
              <input type="month" data-f="from" value="${s.from ? s.from.slice(0,7) : ''}">
              起（留空＝一直有）
            </div>`;
        return `
      <div class="slot-row" data-id="${s.id}">

        <select data-f="mode">

        <input type="time" data-f="start" value="${s.start}">
        <input type="time" data-f="end" value="${s.end}">
        <button type="button" class="btn btn-ghost btn-danger sr-del" data-del="${s.id}">✕</button>

/* ---------- 快速新增：週三 18:30-20:00 班級名稱 ---------- */
const TIME_RE = '(\\d{1,2})(?::(\\d{2}))?\\s*[-~～－—–至到]\\s*(\\d{1,2})(?::(\\d{2}))?\\s*(.*)$';
function parseQuick(text){
  const t = text.trim().replace(/：/g, ':');
  let m = t.match(new RegExp('^(?:週|周|星期|禮拜)?([日天一二三四五六])\\s*' + TIME_RE));
  if(m){
    return {mode:'weekly', wd:'日一二三四五六'.indexOf(m[1] === '天' ? '日' : m[1]),
      start:`${pad(+m[2])}:${m[3] || '00'}`, end:`${pad(+m[4])}:${m[5] || '00'}`, name:(m[6] || '').trim()};
  }
  const D = '(?:\\d{4}[-/]\\d{1,2}[-/]\\d{1,2}|\\d{1,2}/\\d{1,2})';
  m = t.match(new RegExp('^(' + D + '(?:[\\s,、，]+' + D + ')*)\\s+' + TIME_RE));
  if(!m) return null;
  const dates = m[1].split(/[\s,、，]+/).map(tok=>{
    const q = tok.split(/[-/]/).map(Number);
    return q.length === 3 ? fmtDate(q[0], q[1], q[2]) : fmtDate(viewYear, q[0], q[1]);
  });
  return {mode:'dates', dates:Array.from(new Set(dates)).sort(),
    start:`${pad(+m[2])}:${m[3] || '00'}`, end:`${pad(+m[4])}:${m[5] || '00'}`, name:(m[6] || '').trim()};
}
function quickAdd(){
  const input = document.getElementById('quickInput');
  const p = parseQuick(input.value);
  if(!p){ showToast('格式：週三 18:30-20:00 班級名稱，或 11/7 11/21 10:00-12:00 班級名稱'); return; }
  const id = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
  if(p.mode === 'dates'){
    state.slots.push({id, mode:'dates', dates:p.dates, start:p.start, end:p.end, name:p.name});
  }else{
    state.slots.push({id, mode:'weekly', wd:p.wd, start:p.start, end:p.end, name:p.name, from: fmtDate(viewYear, viewMonth, 1)});
  }
  input.value = '';
  persist();
  renderSlotList();
  renderAll();
  showToast(p.mode === 'dates' ? `已新增自選日期班級（${p.dates.length} 天）` : `已新增 ${WD[p.wd]} ${p.start}–${p.end}`);
}

  if(!obj || !Array.isArray(obj.slots)){ showToast('格式不符：找不到班級時段'); return false; }
  state.slots = []; state.staff = [{id:'p1', name:'晏存', c:0}];

  applyData(obj);

}

  ta.focus(); ta.select();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(ta.value).then(()=> showToast('已複製備份文字，請貼到另一個裝置'), ()=> showToast('請長按文字框全選後複製'));
  }else showToast('請長按文字框全選後複製');
});
document.getElementById('backupImportBtn').addEventListener('click', ()=>{
  const text = document.getElementById('backupText').value.trim();
  if(!text){ showToast('請先貼上備份文字'); return; }
  if(!confirm('匯入會取代目前所有資料，確定要匯入嗎？')) return;
  if(importData(text)) showToast('已匯入，資料會同步到雲端');
});

/* ---------- 值班人員 ---------- */
document.getElementById('staffList').addEventListener('change', e=>{
  const row = e.target.closest('.staff-row');
  if(!row || e.target.dataset.sf !== 'name') return;
  const st = staffById(row.dataset.sid);
  if(!st) return;
  const v = e.target.value.trim();
  if(!v){ e.target.value = st.name; return; }
  st.name = v;
  persist();
  renderAll();
});
document.getElementById('staffList').addEventListener('click', e=>{
  const del = e.target.closest('[data-sdel]');
  if(!del) return;
  const st = staffById(del.dataset.sdel);
  if(!st) return;
  if(!confirm(`刪除值班人員「${st.name}」？已指派給他的課程會變成未指派。`)) return;
  state.staff = state.staff.filter(s=> s.id !== st.id);
  Object.keys(state.marks).forEach(ds=>{
    Object.keys(state.marks[ds]).forEach(id=>{
      if(state.marks[ds][id].p === st.id) setRec(ds, id, {p:''});
    });
  });
  persist();
  renderStaffList();
  renderAll();
});
function addStaff(){
  const input = document.getElementById('staffInput');
  const name = input.value.trim();
  if(!name){ showToast('請輸入人員姓名'); return; }
  if(state.staff.some(s=> s.name === name)){ showToast('已有同名人員'); return; }
  const used = new Set(state.staff.map(s=> s.c));
  let c = 0; while(used.has(c) && c < PALETTE.length) c++;
  if(c >= PALETTE.length) c = state.staff.length % PALETTE.length;
  state.staff.push({id:'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,4), name, c});
  input.value = '';
  persist();
  renderStaffList();
  renderAll();
  showToast(`已新增 ${name}`);
}
document.getElementById('staffAddBtn').addEventListener('click', addStaff);
document.getElementById('staffInput').addEventListener('keydown', e=>{
  if(e.key === 'Enter'){ e.preventDefault(); addStaff(); }
});

/* =========================================================
   頁面切換、學員管理
   ========================================================= */
function setView(v){
  if(READONLY) v = 'cal';
  document.getElementById('viewCal').style.display = v === 'cal' ? '' : 'none';
  document.getElementById('viewStu').style.display = v === 'stu' ? '' : 'none';
  document.querySelectorAll('#tabs button').forEach(b=> b.classList.toggle('on', b.dataset.view === v));
  window.scrollTo(0, 0);
}
document.getElementById('tabs').addEventListener('click', e=>{
  const b = e.target.closest('button[data-view]');
  if(b) setView(b.dataset.view);
});

function remChip(stt){
  if(!stt.periods) return `<span class="rem-chip none">未購課</span>`;
  const cls = stt.remaining <= 0 ? 'warn' : (stt.remaining <= 2 ? 'low' : '');
  return `<span class="rem-chip ${cls}">剩 ${stt.remaining} 堂</span>`;
}

function renderStudents(){
  if(READONLY) return;
  const addSel = document.getElementById('stuAddCls');
  const cur = addSel.value;
  addSel.innerHTML = classOptions(cur);

  const now = new Date();
  const ym = `${now.getFullYear()}-${pad(now.getMonth()+1)}`;
  let tu = 0, gear = 0;
  state.students.forEach(st => (st.buys || []).forEach(b=>{
    if((b.date || '').startsWith(ym)){ tu += +b.tuition || 0; gear += +b.gear || 0; }
  }));
  document.getElementById('stuSummary').textContent =
    `共 ${state.students.length} 位學員・本月收款 學費 $${money(tu)}／器材費 $${money(gear)}`;

  const names = classNames();
  const orphan = [];
  state.students.forEach(st => (st.classes || []).forEach(c => { if(!names.includes(c) && !orphan.includes(c)) orphan.push(c); }));
  const groups = names.concat(orphan).map(n => ({
    n, label: names.includes(n) ? n : `${n}（班級已不存在）`,
    list: state.students.filter(x => (x.classes || []).includes(n))
  }));
  const none = state.students.filter(x => !(x.classes || []).length);
  if(none.length) groups.push({n:'', label:'未分班', list: none});

  const html = groups.filter(g => g.list.length).map(g=>`
    <div class="stu-group">
      <div class="sg-head">${esc(g.label)}・${g.list.length} 人</div>
      ${g.list.map(st=>{
        const stt = studentStats(st);
        const bc = g.n ? stt.byClass[g.n] : null;
        const meta = (bc && bc.periods) ? `已購 ${bc.periods} 期・已上 ${bc.used} 堂` : '尚未購買課程';
        const multi = (st.classes || []).length > 1 ? `・共 ${st.classes.length} 班` : '';
        return `<div class="stu-row" data-sid="${st.id}">
          <div><b>${esc(st.name)}</b><small>${meta}${multi}</small></div>
          ${remChip(bc || {periods:0})}
        </div>`;
      }).join('')}
    </div>`).join('');
  document.getElementById('stuList').innerHTML = html ||
    `<div class="empty-state">還沒有學員，請在上方輸入姓名並選擇班級</div>`;
}

function addStudent(){
  const nameEl = document.getElementById('stuAddName');
  const name = nameEl.value.trim();
  if(!name){ showToast('請輸入學員姓名'); return; }
  const st = {
    id: 't' + Date.now().toString(36) + Math.random().toString(36).slice(2,4),
    name,
    classes: document.getElementById('stuAddCls').value ? [document.getElementById('stuAddCls').value] : [],
    buys: []
  };
  state.students.push(st);
  nameEl.value = '';
  persist();
  renderAll();
  openStudentModal(st.id);
}
document.getElementById('stuAddBtn').addEventListener('click', addStudent);
document.getElementById('stuAddName').addEventListener('keydown', e=>{
  if(e.key === 'Enter'){ e.preventDefault(); addStudent(); }
});
document.getElementById('stuList').addEventListener('click', e=>{
  const row = e.target.closest('.stu-row[data-sid]');
  if(row) openStudentModal(row.dataset.sid);
});

/* ---------- 學員資料視窗 ---------- */
const stuOverlay = document.getElementById('stuOverlay');
let editingStu = null;

function renderStuModal(){
  const st = studentById(editingStu);
  if(!st){ stuOverlay.classList.remove('show'); return; }
  document.getElementById('stuName').value = st.name;

  const stt = studentStats(st);
  const names = classNames();
  const allNames = names.concat(stt.names.filter(n => !names.includes(n)));
  document.getElementById('stuClsBox').innerHTML = allNames.length
    ? allNames.map(n=>{
        const on = (st.classes || []).includes(n);
        return `<label class="cls-chip ${on?'on':''}"><input type="checkbox" data-cls="${esc(n)}" ${on?'checked':''}>${esc(n)}</label>`;
      }).join('')
    : `<div class="att-empty">還沒有班級，請先到「管理」新增班級時段並命名</div>`;

  const rank = {};
  Object.keys(stt.byClass).forEach(c=>{
    stt.byClass[c].terms.forEach((t,i)=>{ rank[t.id] = {k:i, t, c}; });
  });
  const clsOpts = cur => `<option value="">請選擇班級</option>` +
    stt.names.map(n => `<option value="${esc(n)}" ${n===cur?'selected':''}>${esc(n)}</option>`).join('');

  document.getElementById('buyList').innerHTML = (st.buys || []).map(b=>{
    let prog = '請選擇這一期是哪個班級';
    const r = rank[b.id];
    if(b.cls && r){
      const u = Math.max(0, Math.min(r.t.n, stt.byClass[b.cls].used - r.t.before));
      prog = `${esc(b.cls)}　第 ${r.k+1} 期　已上 ${u} / ${r.t.n} 堂`;
    }
    return `<div class="buy-row" data-bid="${b.id}">
      <input type="date" data-bf="date" value="${esc(b.date || '')}">
      <select data-bf="cls" style="font-family:'Inter',sans-serif;">${clsOpts(b.cls || '')}</select>
      <button type="button" class="btn btn-ghost btn-danger" data-bdel="${b.id}">✕</button>
      <input type="number" inputmode="numeric" min="0" step="1" data-bf="tuition" placeholder="學費" value="${b.tuition === '' || b.tuition == null ? '' : esc(b.tuition)}">
      <input type="number" inputmode="numeric" min="0" step="1" data-bf="gear" placeholder="器材費" value="${b.gear === '' || b.gear == null ? '' : esc(b.gear)}">
      <input type="number" inputmode="numeric" min="1" step="1" data-bf="n" title="本期堂數" placeholder="堂數" value="${termSize(b)}">
      <div class="buy-prog">${prog}</div>
    </div>`;
  }).join('') || `<div class="att-empty">還沒有購買紀錄，請按「新增一期」</div>`;

  const lines = Object.keys(stt.byClass).filter(c => stt.byClass[c].periods).map(c=>{
    const x = stt.byClass[c];
    return `${esc(c)}：已購 ${x.periods} 期（共 ${x.total} 堂）・已上 ${x.used} 堂・<b>剩 ${x.remaining} 堂</b>`;
  });
  document.getElementById('stuInfo').innerHTML = lines.length
    ? `${lines.join('<br>')}<br>累計繳費 <b>$${money(stt.tuition + stt.gear)}</b>（學費 $${money(stt.tuition)}／器材費 $${money(stt.gear)}）`
    : `尚未購買課程，新增一期並選擇班級後即可開始計算剩餘堂數`;
}
function openStudentModal(id){
  editingStu = id;
  renderStuModal();
  stuOverlay.classList.add('show');
}
function closeStu(){ stuOverlay.classList.remove('show'); renderAll(); }
document.getElementById('closeStuBtn').addEventListener('click', closeStu);
document.getElementById('stuDoneBtn').addEventListener('click', closeStu);
stuOverlay.addEventListener('click', e=>{ if(e.target === stuOverlay) closeStu(); });

document.getElementById('stuName').addEventListener('change', e=>{
  const st = studentById(editingStu); if(!st) return;
  const v = e.target.value.trim();
  if(!v){ e.target.value = st.name; return; }
  st.name = v; persist(); renderAll();
});
document.getElementById('stuClsBox').addEventListener('change', e=>{
  const st = studentById(editingStu);
  const n = e.target.dataset.cls;
  if(!st || n === undefined) return;
  const list = (st.classes || []).filter(c => c !== n);
  if(e.target.checked) list.push(n);
  st.classes = list;
  persist(); renderStuModal(); renderAll();
});
document.getElementById('buyAddBtn').addEventListener('click', ()=>{
  const st = studentById(editingStu); if(!st) return;
  st.buys = st.buys || [];
  const last = st.buys[st.buys.length - 1];
  st.buys.push({
    id: 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2,4),
    date: todayStr,
    cls: last ? last.cls : ((st.classes || [])[0] || ''),
    n: (() => {
      const cl = last ? last.cls : ((st.classes || [])[0] || '');
      const same = st.buys.filter(x => x.cls === cl);
      return same.length ? termSize(same[same.length - 1]) : (state.defaultTerm || FALLBACK_TERM);
    })(),
    tuition: last ? last.tuition : '',
    gear: ''
  });
  persist(); renderStuModal(); renderAll();
});
document.getElementById('buyList').addEventListener('change', e=>{
  const st = studentById(editingStu);
  const row = e.target.closest('.buy-row');
  const f = e.target.dataset.bf;
  if(!st || !row || !f) return;
  const b = (st.buys || []).find(x => x.id === row.dataset.bid);
  if(!b) return;
  if(f === 'date') b.date = e.target.value;
  else if(f === 'cls') b.cls = e.target.value;
  else if(f === 'n'){
    const v = parseInt(e.target.value, 10);
    b.n = v > 0 ? v : (state.defaultTerm || FALLBACK_TERM);
  }
  else{
    const v = parseFloat(e.target.value);
    b[f] = isNaN(v) ? '' : v;
  }
  persist(); renderStuModal(); renderAll();
});
document.getElementById('buyList').addEventListener('click', e=>{
  const del = e.target.closest('[data-bdel]');
  const st = studentById(editingStu);
  if(!del || !st) return;
  if(!confirm('刪除這一期的購買紀錄？')) return;
  st.buys = (st.buys || []).filter(b => b.id !== del.dataset.bdel);
  persist(); renderStuModal(); renderAll();
});
document.getElementById('stuDelBtn').addEventListener('click', ()=>{
  const st = studentById(editingStu); if(!st) return;
  if(!confirm(`刪除學員「${st.name}」？購買紀錄與點名紀錄也會一併移除。`)) return;
  state.students = state.students.filter(x => x.id !== st.id);
  dropAttFor((ds, sid, arr) => arr.includes(st.id) ? arr.filter(x => x !== st.id) : undefined);
  persist();
  stuOverlay.classList.remove('show');
  renderAll();
});

/* =========================================================
   初始化
   ========================================================= */
(async function init(){
  if(READONLY){
    document.getElementById('openManageBtn').style.display = 'none';
    document.getElementById('readonlyTag').style.display = 'inline-block';
    document.getElementById('tabs').style.display = 'none';
  }
  readCache();
  renderAll();
  await loadData();
  renderAll();
})();
</script>
